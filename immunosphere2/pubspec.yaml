name: immunosphere2
description: "A new Flutter project for ImmunoSphere."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  fl_chart: ^0.68.0

  # UI & Design Icons
  cupertino_icons: ^1.0.8

  # Networking for Email Validation API
  http: ^1.2.0

  # Firebase Packages
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.2.10

  # Date Formatting & Locales
  intl: ^0.19.0

  # QR Code Camera Scanning Package
  mobile_scanner: ^5.0.0

  # PDF Generation & Direct Printing
  pdf: ^3.10.8
  printing: ^5.13.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0

  # In-App Video Player Packages (Web & Mobile)
  youtube_player_flutter: ^9.0.1
  youtube_player_iframe: ^5.1.2

  # AI Chatbot & Image Picker Packages
  google_generative_ai: ^0.4.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  flutter_markdown: ^0.7.4+3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets section
  assets:
    - assets/
    - assets/images/