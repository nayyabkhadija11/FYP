name: immunosphere2
description: "A new Flutter project for ImmunoSphere."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design Icons
  cupertino_icons: ^1.0.8

  # Networking for Email Validation API
  http: ^1.2.0

  # Firebase Packages
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Date Formatting & Locales
  intl: ^0.19.0

  # QR Code Camera Scanning Package
  mobile_scanner: ^5.0.0

  # PDF Generation & Direct Printing (Reports Screen ke liye)
  pdf: ^3.10.8
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets section
  assets:
    - assets/
    - assets/images/